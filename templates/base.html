{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attendance Portal{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'portal.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'dashboard' %}">FaceAttend</a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'course_create' %}">New course</a>
        <a href="{% url 'student_create' %}">Add student</a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">{% csrf_token %}<button class="link-button" type="submit">Log out</button></form>
      {% endif %}
    </nav>
  </header>
  <main class="page-shell">
    {% if messages %}
      {% for message in messages %}<div class="notice {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
